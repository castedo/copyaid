site_name: CopyAId.it
site_url: https://copyaid.it/
theme:
  name: material
  features:
    - content.code.copy
    - toc.integrate
    - navigation.footer
    - navigation.indexes
    - navigation.top
    - navigation.tracking
markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
nav:
  - Start:
    - index.md
